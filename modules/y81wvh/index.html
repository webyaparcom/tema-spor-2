  .modulex-zaman-pano *, .modulex-zaman-pano *::before, .modulex-zaman-pano *::after { box-sizing: border-box; }

  .modulex-zaman-pano :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */

  .modulex-zaman-pano [hidden] { display: none !important; }

  .modulex-zaman-pano-ic { max-width: --max--; margin-inline: auto; }

  .modulex-zaman-pano-pano { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: clamp(22px, 3vw, 36px); padding: 12px 6px; }
  .modulex-zaman-pano-not { position: relative; display: grid; align-content: start; gap: 10px; padding: 30px 22px 24px; border-radius: 6px; background-color: --kartBg--; box-shadow: 0 18px 30px -22px color-mix(in srgb, --text-- 60%, transparent), 0 1px 0 --cizgi--; transform: rotate(var(--d)); transition: transform 0.35s ease, box-shadow 0.35s ease; }
  .modulex-zaman-pano-not:hover { transform: rotate(0deg) translateY(-4px); box-shadow: 0 26px 40px -24px color-mix(in srgb, --text-- 60%, transparent); }

  .modulex-zaman-pano-igne { position: absolute; inset-block-start: -9px; inset-inline-start: 50%; width: 18px; height: 18px; margin-inline-start: -9px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, color-mix(in srgb, --accent-- 40%, --kartBg--), --accent-- 60%); box-shadow: 0 3px 4px -1px color-mix(in srgb, --text-- 50%, transparent); }
  .modulex-zaman-pano-not--vurgu .modulex-zaman-pano-igne { background: radial-gradient(circle at 35% 35%, --vurguText--, color-mix(in srgb, --vurguText-- 70%, --text--) 70%); }
  .modulex-zaman-pano-nust { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

  @media (max-width: 768px) {

  @media (prefers-reduced-motion: reduce) {

</style>
<script>
  (() => {
    const P = "modulex-zaman-pano";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
