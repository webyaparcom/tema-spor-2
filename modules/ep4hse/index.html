  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */

  .modulex-referans-ray-kart-bas { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 48px; align-items: end; }
  .modulex-referans-ray-kart-ust { grid-column: 1 / -1; }
  .modulex-referans-ray-kart-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-referans-ray-kart-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }

  .modulex-referans-ray-kart-ray { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 280px); gap: 16px; padding-block-end: 6px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }

  .modulex-referans-ray-kart-kart:hover > * { border-color: --accent--; transform: translateY(-3px); }
  .modulex-referans-ray-kart-pano { display: grid; place-items: center; aspect-ratio: 16 / 10; padding: 24px; background: --kartBg--; text-align: center; }
  .modulex-referans-ray-kart-kelime { font-size: 1.3rem; }
  .modulex-referans-ray-kart-kart:hover .modulex-referans-ray-kart-logo { filter: none; }
  .modulex-referans-ray-kart-alt { display: grid; align-content: start; gap: 6px; padding: 18px 20px 22px; }
  .modulex-referans-ray-kart-ad { font-size: 1.08rem; font-weight: 700; line-height: 1.3; }
  .modulex-referans-ray-kart-yil { display: inline-flex; align-items: center; gap: 6px; }
  .modulex-referans-ray-kart-yil .material-symbols-outlined { font-size: 18px; }
  .modulex-referans-ray-kart-kontrol { display: flex; justify-content: flex-end; gap: 10px; margin-block-start: 18px; }
  .modulex-referans-ray-kart-ok { display: inline-grid; place-items: center; width: 48px; height: 48px; border: 1px solid --cizgi--; border-radius: 50%; background: --kartBg--; color: --text--; transition: background 0.25s ease, color 0.25s ease, opacity 0.25s ease; }
  .modulex-referans-ray-kart-ok:hover:not(:disabled) { background: --accent--; color: --accentText--; }
  .modulex-referans-ray-kart-ok:disabled { opacity: 0.4; cursor: default; }
  @media (max-width: 768px) { .modulex-referans-ray-kart-ray { grid-auto-columns: 78%; } }
  .modulex-referans-ray-kart-logo { display: block; width: auto; max-width: 100%; height: clamp(32px, 4vw, 48px); object-fit: contain; filter: grayscale(1); transition: filter 0.3s ease, transform 0.3s ease; }
  .modulex-referans-ray-kart-kelime { display: inline-block; color: --text--; font-family: var(--mx-font-heading, inherit); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; transition: color 0.3s ease; }
  .modulex-referans-ray-kart-bag { color: inherit; text-decoration: none; }
  .modulex-referans-ray-kart-sektor { color: --accentInk--; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .modulex-referans-ray-kart-kmetin { color: --muted--; font-size: 0.95rem; line-height: 1.65; }
  .modulex-referans-ray-kart-yil { color: --muted--; font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .modulex-referans-ray-kart-harf img { width: 100%; height: 100%; object-fit: contain; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-referans-ray-kart :is(.modulex-referans-ray-kart-baslik, .modulex-referans-ray-kart-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-referans-ray-kart-baslik { line-height: 1.35; }
  @media (max-width: 1024px) {
    .modulex-referans-ray-kart-bas { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 768px) {
    .modulex-referans-ray-kart { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-referans-ray-kart *, .modulex-referans-ray-kart *::before, .modulex-referans-ray-kart *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-referans-ray-kart";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const ray = (s, P) => {
        const ray = s.querySelector("." + P + "-ray");
        if (!ray) return;
        const dugme = [...s.querySelectorAll("[data-ray]")];
        const durum = () => {
          const max = ray.scrollWidth - ray.clientWidth - 2;
          const x = Math.abs(ray.scrollLeft);
          dugme.forEach((b) => { b.disabled = max <= 0 || (b.dataset.ray === "geri" ? x <= 2 : x >= max); });
        };
        dugme.forEach((b) => b.addEventListener("click", () => {
          const ilk = ray.firstElementChild;
          const adim = (ilk ? ilk.getBoundingClientRect().width : ray.clientWidth * 0.8) + 16;
          const rtl = getComputedStyle(ray).direction === "rtl";
          ray.scrollBy({ left: (b.dataset.ray === "ileri" ? 1 : -1) * (rtl ? -1 : 1) * adim, behavior: "smooth" });
        }));
        ray.addEventListener("scroll", durum, { passive: true });
        durum();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      ray(s, P, az);
    });
  })();
</script>
