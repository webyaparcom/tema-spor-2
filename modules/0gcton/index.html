<section class="modulex-iletisim-akordeon{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-iletisim-akordeon-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* iletisim-akordeon — Çok bilgili (birden çok numara/adres) iletişim sayfalarında dikey yeri toplar; klavye ve ekran okuyucu yerel davranışla çalışır. */
  .modulex-iletisim-akordeon { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-iletisim-akordeon *, .modulex-iletisim-akordeon *::before, .modulex-iletisim-akordeon *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-iletisim-akordeon :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-iletisim-akordeon :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-iletisim-akordeon :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-iletisim-akordeon :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-iletisim-akordeon img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-iletisim-akordeon) img { height: auto; }
  .modulex-iletisim-akordeon [hidden] { display: none !important; }
  .modulex-iletisim-akordeon :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-iletisim-akordeon :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-iletisim-akordeon-ic { max-width: --max--; margin-inline: auto; }
  .modulex-iletisim-akordeon-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-iletisim-akordeon--bassiz .modulex-iletisim-akordeon-bas { display: none; }
  .modulex-iletisim-akordeon-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-iletisim-akordeon-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-iletisim-akordeon-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-iletisim-akordeon-ic { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: clamp(32px, 5vw, 80px); align-items: start; }
  .modulex-iletisim-akordeon-bas { position: sticky; inset-block-start: 96px; margin: 0; }
  .modulex-iletisim-akordeon--bassiz .modulex-iletisim-akordeon-ic { grid-template-columns: minmax(0, 1fr); }
  .modulex-iletisim-akordeon-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-iletisim-akordeon-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-iletisim-akordeon-dugme:hover { transform: translateY(-2px); }
  .modulex-iletisim-akordeon-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-iletisim-akordeon-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-iletisim-akordeon-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-iletisim-akordeon-liste { display: grid; gap: 10px; }
  .modulex-iletisim-akordeon-oge { border: 1px solid --cizgi--; border-radius: --yuvarlak--; background: --kartBg--; transition: border-color 0.25s ease; }
  .modulex-iletisim-akordeon-oge[open] { border-color: --accent--; }
  .modulex-iletisim-akordeon-ozet { display: flex; align-items: center; gap: 14px; padding: 14px 18px; font-weight: 700; list-style: none; }
  .modulex-iletisim-akordeon-ozet::-webkit-details-marker { display: none; }
  .modulex-iletisim-akordeon-oad { flex: 1; }
  .modulex-iletisim-akordeon-isaret { transition: transform 0.3s ease; }
  .modulex-iletisim-akordeon-oge[open] .modulex-iletisim-akordeon-isaret { transform: rotate(180deg); }
  .modulex-iletisim-akordeon-icerik { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 20px; padding: 0 18px 18px; padding-inline-start: 80px; animation: modulex-iletisim-akordeon-ac 0.3s ease both; }
  @keyframes modulex-iletisim-akordeon-ac { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .modulex-iletisim-akordeon-icerik .modulex-iletisim-akordeon-deger { font-size: 1.1rem; }
  .modulex-iletisim-akordeon-eylemler { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  @media (max-width: 768px) {
    .modulex-iletisim-akordeon-icerik { padding-inline-start: 18px; }
  }
  .modulex-iletisim-akordeon-kikon { flex: none; display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: color-mix(in srgb, --accent-- 14%, transparent); color: --accentInk--; font-size: 24px; }
  .modulex-iletisim-akordeon-ketiket { display: block; color: --muted--; font-size: 0.82rem; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }
  .modulex-iletisim-akordeon-deger { color: inherit; font-weight: 650; text-decoration: none; overflow-wrap: anywhere; transition: color 0.2s ease; }
  a.modulex-iletisim-akordeon-deger:hover { color: --accentInk--; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-iletisim-akordeon-eylem { display: inline-flex; align-items: center; gap: 6px; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.2s ease; }
  .modulex-iletisim-akordeon-eylem:hover { gap: 10px; }
  .modulex-iletisim-akordeon-eylem .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-akordeon-kopya { display: none; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: --text--; font: inherit; font-size: 0.85rem; font-weight: 650; transition: border-color 0.2s ease, background 0.2s ease; }
  .modulex-iletisim-akordeon--kjs .modulex-iletisim-akordeon-kopya { display: inline-flex; }
  .modulex-iletisim-akordeon-kopya:hover { border-color: --accent--; }
  .modulex-iletisim-akordeon-kopya .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-akordeon--kopyalandi { background: color-mix(in srgb, --accent-- 14%, transparent); }
  .modulex-iletisim-akordeon-sosyal { display: grid; gap: 10px; }
  .modulex-iletisim-akordeon-sbaslik { color: --muted--; font-size: 0.9rem; font-weight: 650; }
  .modulex-iletisim-akordeon-sliste { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-iletisim-akordeon-cip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-weight: 650; text-decoration: none; transition: border-color 0.2s ease, transform 0.2s ease; }
  .modulex-iletisim-akordeon-cip:hover { border-color: --accent--; transform: translateY(-2px); }
  .modulex-iletisim-akordeon-cikon { font-size: 18px; }
  .modulex-iletisim-akordeon-harita { position: relative; overflow: hidden; min-height: 280px; border-radius: --yuvarlak--; background: --kartBg--; }
  .modulex-iletisim-akordeon-iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .modulex-iletisim-akordeon-hdesen { position: absolute; inset: 0; display: grid; place-items: center; background-color: color-mix(in srgb, --accent-- 8%, --kartBg--); background-image: linear-gradient(color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), radial-gradient(circle at 30% 40%, color-mix(in srgb, --accent-- 18%, transparent) 0 18%, transparent 19%); background-size: 36px 36px, 36px 36px, 100% 100%; }
  .modulex-iletisim-akordeon-pin { color: --accentInk--; font-size: 56px; animation: modulex-iletisim-akordeon-zipla 2.4s ease-in-out infinite; }
  @keyframes modulex-iletisim-akordeon-zipla { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .modulex-iletisim-akordeon-hyol { position: absolute; inset-block-end: 16px; inset-inline-start: 16px; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 999px; background: --bg--; color: --text--; font-weight: 700; text-decoration: none; box-shadow: 0 6px 20px color-mix(in srgb, --text-- 16%, transparent); transition: transform 0.2s ease; }
  .modulex-iletisim-akordeon-hyol:hover { transform: translateY(-2px); }
  .modulex-iletisim-akordeon-hyol .material-symbols-outlined { font-size: 18px; color: --accentInk--; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-akordeon :is(.modulex-iletisim-akordeon-baslik, .modulex-iletisim-akordeon-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-akordeon-baslik { line-height: 1.35; }
  @media (max-width: 1024px) {
    .modulex-iletisim-akordeon-ic { grid-template-columns: minmax(0, 1fr); }
    .modulex-iletisim-akordeon-bas { position: static; margin-block-end: 32px; }
  }
  @media (max-width: 768px) {
    .modulex-iletisim-akordeon { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-iletisim-akordeon *, .modulex-iletisim-akordeon *::before, .modulex-iletisim-akordeon *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-iletisim-akordeon";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const kopyala = (s, P) => {
        if (!navigator.clipboard || !navigator.clipboard.writeText) return;
        s.classList.add(P + "--kjs");
        s.querySelectorAll("[data-kopyala]").forEach((b) => {
          const yazi = b.querySelector("." + P + "-kyazi");
          const ilk = yazi ? yazi.textContent : "";
          b.addEventListener("click", () => {
            const bitti = () => {
              b.classList.add(P + "--kopyalandi");
              if (yazi) yazi.textContent = b.dataset.tamam || ilk;
              setTimeout(() => { b.classList.remove(P + "--kopyalandi"); if (yazi) yazi.textContent = ilk; }, 2000);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(b.dataset.kopyala).then(bitti, () => {});
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      kopyala(s, P, az);
    });
  })();
</script>
